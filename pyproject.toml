[project]
name = "project-co-imaginer"
version = "0.1.0"
requires-python = "==3.13.18"
dependencies = [
  "benchmarl==1.5.2",
  "cloudpickle==3.1.2",
  "dm-control==1.0.49",
  "gymnasium==1.4.0",
  "mujoco==3.16.0",
  "torch==2.10.0",
  "torch-geometric==2.8.1",
  "torchrl==0.11.1",
  "torchvision==0.25.0",
  "vmas==1.5.2",
  "wandb==0.31.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = ["labmaze; sys_platform == 'never'"]

[tool.pytest.ini_options]
pythonpath = [".", "third_party/r2dreamer"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["third_party"]
force-exclude = true
