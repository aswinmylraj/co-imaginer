[project]
name = "project-co-imaginer"
version = "0.1.0"
requires-python = "==3.13.18"
dependencies = [
  "benchmarl==1.5.2",
  "dm-control==1.0.51",
  "gymnasium==1.4.0",
  "hydra-core==1.3.8",
  "tensorboard==2.21.0",
  "torch==2.10.0",
  "torch-geometric==2.8.1",
  "torchrl==0.11.1",
  "torchvision==0.25.0",
  "vmas==1.5.2",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# labmaze, a dm-control dependency used only by locomotion mazes, has no Python 3.13 wheel and needs Bazel to build.
override-dependencies = ["labmaze; sys_platform == 'never'"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
